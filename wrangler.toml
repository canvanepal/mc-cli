# Template — replace the KV namespace id with your own before deploying.
#   wrangler kv namespace create MC_KV
# then paste the returned id below.
name = "mc-worker"
main = "mc_worker.js"
compatibility_date = "2025-01-01"

kv_namespaces = [
  { binding = "KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

[triggers]
crons = ["*/2 * * * *", "0 */6 * * *"]   # */2 = keepalive pulse, 6h = cookie status check